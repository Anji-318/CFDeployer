name: Build & Release

on:
  push:
    tags: ['v*']  # 推送 v 开头标签时触发
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - run: dotnet restore CFDeployer.csproj
      
      - run: dotnet build CFDeployer.csproj -c Release --no-restore
      
      - run: dotnet publish CFDeployer.csproj -c Release -o ./publish --self-contained -r win-x64 -p:PublishSingleFile=true
      
      - name: Zip
        run: Compress-Archive -Path ./publish/* -DestinationPath CFDeployer.zip
      
      # 上传到 Artifacts（临时）
      - uses: actions/upload-artifact@v4
        with:
          name: CFDeployer
          path: CFDeployer.zip
      
      # 自动发布到 GitHub Release（永久，免登录下载）
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: CFDeployer.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
