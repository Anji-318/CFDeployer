name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '请输入要发布的版本号 (例如 v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须设置为 0，否则无法获取完整的 git 历史来推送 tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore CFDeployer.csproj
      - run: dotnet build CFDeployer.csproj -c Release --no-restore
      - run: dotnet publish CFDeployer.csproj -c Release -o ./publish --self-contained -r win-x64 -p:PublishSingleFile=true

      - name: Zip
        run: Compress-Archive -Path ./publish/* -DestinationPath CFDeployer.zip

      # 新增步骤：如果是手动触发，强制覆盖远程 Tag
      - name: Force update tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag -f ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }} --force
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: CFDeployer.zip
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
