name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - run: dotnet restore CFDeployer.csproj
      
      - run: dotnet build CFDeployer.csproj -c Release --no-restore
      
      - run: dotnet publish CFDeployer.csproj -c Release -o ./publish --no-build
      
      - uses: actions/upload-artifact@v4
        with:
          name: CFDeployer
          path: ./publish
